<svg viewBox="0 0 1180 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#14356b" />
    </marker>
    <marker id="setaVerde" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3bb273" />
    </marker>
  </defs>

  <rect width="1180" height="620" fill="#ffffff" />

  <!-- Título -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#14356b">Camada de captura — do protótipo à produção</text>
  <text x="40" y="62" font-size="13" fill="#5a6472">Mesmo desenho de dados nas duas linhas: evento de pageview com anonymous_id, session_id e (quando houver) usuario_id.</text>

  <!-- ===================== LINHA 1: PRODUÇÃO ===================== -->
  <text x="40" y="108" font-size="13" font-weight="700" fill="#14356b" letter-spacing="0.5">STACK DA BANCA (PRODUÇÃO PROPOSTA)</text>

  <!-- Box: React -->
  <g>
    <rect x="40" y="125" width="190" height="90" rx="10" fill="#eaf1ff" stroke="#14356b" stroke-width="1.5"/>
    <text x="135" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#14356b">React (Vite)</text>
    <text x="135" y="176" font-size="11.5" text-anchor="middle" fill="#405066">snippet de tracking</text>
    <text x="135" y="192" font-size="11.5" text-anchor="middle" fill="#405066">embutido no Portal</text>
  </g>
  <line x1="230" y1="170" x2="272" y2="170" stroke="#14356b" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Box: API Gateway -->
  <g>
    <rect x="274" y="125" width="190" height="90" rx="10" fill="#eaf1ff" stroke="#14356b" stroke-width="1.5"/>
    <text x="369" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#14356b">API Gateway</text>
    <text x="369" y="176" font-size="11.5" text-anchor="middle" fill="#405066">POST /track</text>
    <text x="369" y="192" font-size="11.5" text-anchor="middle" fill="#405066">autenticação, rate limit</text>
  </g>
  <line x1="464" y1="170" x2="506" y2="170" stroke="#14356b" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Box: Lambda Node -->
  <g>
    <rect x="508" y="125" width="190" height="90" rx="10" fill="#eaf1ff" stroke="#14356b" stroke-width="1.5"/>
    <text x="603" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#14356b">Lambda (Node.js)</text>
    <text x="603" y="176" font-size="11.5" text-anchor="middle" fill="#405066">valida, gera event_id</text>
    <text x="603" y="192" font-size="11.5" text-anchor="middle" fill="#405066">calcula session_id</text>
  </g>
  <line x1="698" y1="170" x2="740" y2="170" stroke="#14356b" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Box: Armazenamento -->
  <g>
    <rect x="742" y="125" width="190" height="90" rx="10" fill="#eaf1ff" stroke="#14356b" stroke-width="1.5"/>
    <text x="837" y="152" font-size="14" font-weight="700" text-anchor="middle" fill="#14356b">Armazenamento</text>
    <text x="837" y="170" font-size="11.5" text-anchor="middle" fill="#405066">DynamoDB (eventos)</text>
    <text x="837" y="186" font-size="11.5" text-anchor="middle" fill="#405066">S3 (histórico / export)</text>
  </g>
  <line x1="932" y1="170" x2="974" y2="170" stroke="#14356b" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Box: Dashboard -->
  <g>
    <rect x="976" y="125" width="164" height="90" rx="10" fill="#eaf1ff" stroke="#14356b" stroke-width="1.5"/>
    <text x="1058" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#14356b">Dashboard</text>
    <text x="1058" y="176" font-size="11.5" text-anchor="middle" fill="#405066">segmentação +</text>
    <text x="1058" y="192" font-size="11.5" text-anchor="middle" fill="#405066">ação de reengajamento</text>
  </g>

  <!-- ===================== conectores verticais (mapeamento) ===================== -->
  <g stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="135" y1="215" x2="135" y2="305"/>
    <line x1="369" y1="215" x2="369" y2="305"/>
    <line x1="603" y1="215" x2="603" y2="305"/>
    <line x1="837" y1="215" x2="837" y2="305"/>
    <line x1="1058" y1="215" x2="1058" y2="305"/>
  </g>
  <text x="590" y="260" font-size="11.5" fill="#8b96a3" text-anchor="middle">mesmo contrato de evento em ambas as linhas — só muda o transporte</text>

  <!-- ===================== LINHA 2: PROTÓTIPO ===================== -->
  <text x="40" y="325" font-size="13" font-weight="700" fill="#1f7a4c" letter-spacing="0.5">PROTÓTIPO DESTE HACKATHON (funcionando agora)</text>

  <!-- Box: HTML + tracker.js -->
  <g>
    <rect x="40" y="342" width="190" height="96" rx="10" fill="#eafaf1" stroke="#3bb273" stroke-width="1.5"/>
    <text x="135" y="372" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a4c">portal_demo.html</text>
    <text x="135" y="390" font-size="11.5" text-anchor="middle" fill="#3a5a48">+ tracker.js</text>
    <text x="135" y="406" font-size="11.5" text-anchor="middle" fill="#3a5a48">cookie 1st-party</text>
    <text x="135" y="422" font-size="11.5" text-anchor="middle" fill="#3a5a48">(anonymous_id, session_id)</text>
  </g>
  <line x1="230" y1="390" x2="272" y2="390" stroke="#3bb273" stroke-width="2" marker-end="url(#setaVerde)"/>

  <!-- Box: Flask -->
  <g>
    <rect x="274" y="342" width="190" height="96" rx="10" fill="#eafaf1" stroke="#3bb273" stroke-width="1.5"/>
    <text x="369" y="378" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a4c">tracker_server.py</text>
    <text x="369" y="396" font-size="11.5" text-anchor="middle" fill="#3a5a48">Flask · POST /api/track</text>
    <text x="369" y="412" font-size="11.5" text-anchor="middle" fill="#3a5a48">roda em localhost:5000</text>
  </g>
  <line x1="464" y1="390" x2="506" y2="390" stroke="#3bb273" stroke-width="2" marker-end="url(#setaVerde)"/>

  <!-- Box: CSV -->
  <g>
    <rect x="508" y="342" width="190" height="96" rx="10" fill="#eafaf1" stroke="#3bb273" stroke-width="1.5"/>
    <text x="603" y="378" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a4c">eventos_live.csv</text>
    <text x="603" y="396" font-size="11.5" text-anchor="middle" fill="#3a5a48">mesmas colunas de</text>
    <text x="603" y="412" font-size="11.5" text-anchor="middle" fill="#3a5a48">acessos_simulados.csv</text>
  </g>
  <line x1="698" y1="390" x2="740" y2="390" stroke="#3bb273" stroke-width="2" marker-end="url(#setaVerde)"/>

  <!-- Box: Streamlit (mesmo formato do dashboard) -->
  <g>
    <rect x="742" y="342" width="398" height="96" rx="10" fill="#eafaf1" stroke="#3bb273" stroke-width="1.5"/>
    <text x="941" y="374" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a4c">app.py — aba "🔴 Captura ao vivo"</text>
    <text x="941" y="392" font-size="11.5" text-anchor="middle" fill="#3a5a48">lê eventos_live.csv com polling de 2s</text>
    <text x="941" y="408" font-size="11.5" text-anchor="middle" fill="#3a5a48">mostra sessão anônima virando usuario_id em segundos</text>
  </g>

  <!-- ===================== Legenda / nota final ===================== -->
  <rect x="40" y="470" width="1100" height="118" rx="8" fill="#f4f6fa" stroke="#dfe4ec"/>
  <text x="58" y="495" font-size="13" font-weight="700" fill="#14356b">O que isso prova no pitch</text>
  <text x="58" y="518" font-size="12" fill="#33404f">1. A camada de captura existe de fato — não é um slide de intenção: clique real → evento real → linha real no CSV → linha real no dashboard.</text>
  <text x="58" y="538" font-size="12" fill="#33404f">2. O contrato de dados (colunas, nomes, tipos) é o mesmo entre protótipo e produção — trocar Flask/CSV por API Gateway/Lambda/DynamoDB não muda o dashboard.</text>
  <text x="58" y="558" font-size="12" fill="#33404f">3. O "momento de stitching" (visitante anônimo → fornecedor identificado) é visível ao vivo: mesmo anonymous_id, session_id ganha um usuario_id no meio da sessão.</text>
</svg>
